[package]
name = "pagesai-disk-client"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "PagesAI Disk desktop sync client"
publish = false

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-autostart = "=2.5.1"
tauri-plugin-single-instance = "=2.4.3"
tauri-plugin-updater = "=2.10.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "=4.1.6", default-features = false, features = ["v1"] }
pagesai-disk-sync = { path = "../../sync", default-features = false }

[features]
default = ["generic"]
generic = ["pagesai-disk-sync/generic"]
pku = ["pagesai-disk-sync/pku"]

[workspace]
