[package]
name = "pagesai-disk-sync"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "PagesAI public Disk two-way sync engine and client bridge"

[lib]
name = "pagesai_disk_sync"
path = "src/lib.rs"

[[bin]]
name = "pagesai-disk-sync"
path = "src/bin/sync.rs"

[dependencies]
base64 = "0.22"
fs2 = "0.4"
hex = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
url = "2"

[features]
default = ["generic"]
generic = []
pku = []

[workspace]
