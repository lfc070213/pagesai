<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PagesAI Paper</title>
  <link rel="stylesheet" href="/paper-app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">P</span>
      <div>
        <h1>Paper</h1>
        <p id="account" class="muted">正在读取账号…</p>
      </div>
    </div>
    <div class="toolbar">
      <button id="refresh" type="button" class="secondary">刷新</button>
      <button id="upload-trigger" type="button">上传论文</button>
    </div>
  </header>

  <p id="notice" class="notice" hidden></p>

  <main id="console" class="layout">
    <aside class="sidebar">
      <label id="dropzone" class="dropzone" for="file-input">
        <strong>上传论文</strong>
        <span>拖入文件，或点击选择</span>
        <span class="muted">PDF / TXT / Markdown，最大 128 MB</span>
        <input id="file-input" type="file" accept=".pdf,.txt,.text,.md,.markdown,application/pdf,text/plain,text/markdown" hidden>
      </label>
      <p id="upload-status" class="hint" hidden></p>

      <div class="list-head">
        <h2>我的论文</h2>
      </div>
      <ul id="doc-list" class="doc-list"></ul>
      <p id="list-empty" class="empty" hidden>还没有论文，先上传一份 PDF 或文本。</p>
    </aside>

    <section class="workspace" aria-live="polite">
      <div id="welcome" class="empty-panel">
        <h2>选择一篇论文开始精读</h2>
        <p class="muted">上传 PDF 或文本后，可左右对照原文与译文、逐句高亮、停止/继续翻译，并就正文提问并查看引用。</p>
        <p class="muted">翻译与问答需要管理员配置对应适配器；未配置时会明确提示，不会生成占位内容。</p>
      </div>

      <article id="doc-view" class="doc-view" hidden>
        <header class="doc-head">
          <div class="doc-head-text">
            <h1 id="doc-title"></h1>
            <p id="doc-meta" class="muted"></p>
          </div>
          <div class="doc-actions">
            <a id="download-original" class="button secondary" download>下载原件</a>
            <button id="toggle-pdf" type="button" class="secondary" hidden>PDF 原件</button>
            <label class="lang-field" for="translate-lang">
              <span class="muted">目标语言</span>
              <select id="translate-lang">
                <option value="zh">中文</option>
                <option value="en">English</option>
                <option value="ja">日本語</option>
              </select>
            </label>
            <button id="translate-start" type="button">开始翻译</button>
            <button id="translate-stop" type="button" class="danger" hidden>停止翻译</button>
            <button id="delete-doc" type="button" class="danger">删除</button>
          </div>
        </header>

        <section id="pdf-panel" class="pdf-panel" hidden>
          <div class="pdf-bar">
            <span id="pdf-note" class="hint"></span>
            <a id="pdf-new-tab" class="button secondary small" target="_blank" rel="noopener">新标签打开</a>
          </div>
          <iframe id="pdf-frame" title="PDF 原件"></iframe>
        </section>

        <section class="job-panel" aria-live="polite">
          <div class="job-line">
            <span id="job-status" class="job-status">未翻译</span>
            <span id="job-percent" class="hint"></span>
          </div>
          <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="job-progress">
            <div id="job-bar" class="progress-bar"></div>
          </div>
          <p id="job-error" class="hint" hidden></p>
        </section>

        <div class="reader-toolbar">
          <div class="view-switch" role="group" aria-label="阅读视图">
            <button type="button" data-view="aligned" class="active">左右对照</button>
            <button type="button" data-view="original">仅原文</button>
            <button type="button" data-view="translation">仅译文</button>
          </div>
          <span class="hint">点击任意句子可双语定位；右键句子可带入提问。左右对照共用同一滚动容器，不会错行。</span>
        </div>

        <div id="reader" class="reader" data-view="aligned">
          <div class="reader-head">
            <span class="head-label" data-col="original">原文</span>
            <span class="head-label" data-col="translation">译文</span>
          </div>
          <div id="reader-body" class="reader-body"></div>
        </div>

        <section class="ask-panel">
          <h2>问 AI</h2>
          <form id="ask-form">
            <textarea id="ask-input" rows="3" maxlength="2000" placeholder="就这篇论文提问，例如：作者的核心贡献是什么？"></textarea>
            <div class="ask-actions">
              <button id="ask-submit" type="submit">提问</button>
              <span id="ask-hint" class="hint">答案只基于正文检索出的句子，并附可定位的引用。</span>
            </div>
          </form>
          <div id="ask-result" hidden>
            <p id="ask-answer" class="answer"></p>
            <p id="ask-degraded" class="hint" hidden></p>
            <h3>引用</h3>
            <ol id="ask-citations" class="citations"></ol>
          </div>
        </section>
      </article>
    </section>
  </main>

  <div id="context-menu" class="context-menu" hidden role="menu">
    <button type="button" data-action="ask">问 AI 这句</button>
    <button type="button" data-action="copy">复制原文</button>
  </div>

  <script src="/paper-app.js"></script>
</body>
</html>
