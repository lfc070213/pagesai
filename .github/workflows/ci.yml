name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Full tests with temporary MongoDB
        env:
          PAGESAI_MONGO_TEST: '1'
          MONGOMS_DOWNLOAD_DIR: ${{ runner.temp }}/mongo-binaries
        run: node tools/test-all.js
      - run: cargo test --locked --manifest-path modules/disk/sync/Cargo.toml
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/sync-target
      - run: node deploy/validate-presets.js
      - run: node tools/license-scan.js --check
      - run: node tools/public-bundle.js --out "$RUNNER_TEMP/candidate"
      - run: node tools/verify-release.js --artifact "$RUNNER_TEMP/candidate"
