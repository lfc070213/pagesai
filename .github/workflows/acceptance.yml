name: Isolated release acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node deploy/validate-presets.js
      - run: node tools/container-acceptance.js "$RUNNER_TEMP/container-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-evidence
          path: ${{ runner.temp }}/container-evidence
          retention-days: 7
